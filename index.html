<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Consultorias de R&amp;S · Cabana Burger</title>
<style>
:root{
  --green:#53A246;
  --green-dark:#3E7C34;
  --green-light:#E4F1DD;
  --dark:#1B1910;
  --cream:#FFF5CC;
  --cream-deep:#F7E7A6;
  --cream-line:#EAD9A0;
  --grey-bg:#FBF3DC;
  --grey-line:#E9DCB0;
  --grey-text:#7A6E4D;
  --white:#FFFDF6;
  --red:#C4453F;
  --red-bg:#F7E3D9;
  --amber:#B97A1E;
  --amber-bg:#FBEBC7;
  --blue:#3E7C6E;
  --blue-bg:#DEEDE4;
  --grey-chip:#8B7F5C;
  --grey-chip-bg:#F0E6C4;
  --radius:14px;
  --shadow: 0 1px 2px rgba(27,25,16,.06), 0 4px 16px rgba(27,25,16,.07);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  background:var(--grey-bg);
  color:var(--dark);
  -webkit-font-smoothing:antialiased;
}
/* ---------- TOPBAR ---------- */
.topbar{
  background:var(--white);
  border-bottom:1px solid var(--grey-line);
  padding:18px 28px;
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap;
  position:sticky; top:0; z-index:50;
}
.topbar-left{display:flex; align-items:center; gap:12px;}
.topbar-left img{height:38px; display:block;}
.wordmark{font-size:19px; font-weight:800; color:var(--dark); letter-spacing:-.3px;}
.wordmark span{color:var(--green);}
.topbar-titles h1{font-size:17px; margin:0; font-weight:700; color:var(--dark);}
.topbar-titles p{font-size:12.5px; margin:1px 0 0; color:var(--grey-text);}
.topbar-right{display:flex; align-items:center; gap:10px;}
.updated-chip{
  font-size:11.5px; color:var(--green-dark); background:var(--green-light);
  border:1px solid #D3E8CE; padding:5px 12px; border-radius:20px; font-weight:600;
  white-space:nowrap;
}
/* ---------- TABS ---------- */
.tabs{
  display:flex; gap:4px; background:var(--white); border-bottom:1px solid var(--grey-line);
  padding:0 24px; overflow-x:auto; position:sticky; top:71px; z-index:49;
}
.tab-btn{
  border:none; background:transparent; padding:14px 16px; font-size:13.5px; font-weight:600;
  color:var(--grey-text); cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap;
  transition:.15s;
}
.tab-btn:hover{color:var(--dark);}
.tab-btn.active{color:var(--green-dark); border-bottom-color:var(--green);}
/* ---------- LAYOUT ---------- */
main{max-width:1320px; margin:0 auto; padding:26px 24px 60px;}
.view{display:none;}
.view.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
h2.section-title{font-size:19px; margin:0 0 4px; font-weight:800;}
p.section-sub{font-size:13px; color:var(--grey-text); margin:0 0 18px;}
.block{margin-bottom:34px;}

/* ---------- KPI CARDS ---------- */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px;}
.kpi-card{
  background:var(--white); border:1px solid var(--grey-line); border-top:3px solid var(--green);
  border-radius:var(--radius);
  padding:16px 16px; box-shadow:var(--shadow);
}
.kpi-card .kpi-label{font-size:11.5px; color:var(--grey-text); font-weight:600; text-transform:uppercase; letter-spacing:.3px;}
.kpi-card .kpi-value{font-size:30px; font-weight:800; margin-top:6px; line-height:1;}
.kpi-card .kpi-foot{font-size:11.5px; color:var(--grey-text); margin-top:6px;}
.kpi-card.accent{border-color:#CDE6C6; background:var(--green-light); border-top-color:var(--green);}
.kpi-card.accent .kpi-value{color:var(--green-dark);}
.kpi-card.warn{border-color:#EED6A0; background:var(--amber-bg); border-top-color:var(--amber);}
.kpi-card.warn .kpi-value{color:var(--amber);}
.kpi-card.danger{border-color:#E7C2B5; background:var(--red-bg); border-top-color:var(--red);}
.kpi-card.danger .kpi-value{color:var(--red);}

/* ---------- CONSULTORIA COMPARE CARDS ---------- */
.compare-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px;}
.compare-card{
  background:var(--white); border:1px solid var(--grey-line); border-radius:var(--radius);
  padding:18px 20px; box-shadow:var(--shadow); border-top:4px solid var(--green);
}
.compare-card:nth-child(2){border-top-color:var(--amber);}
.compare-card:nth-child(3){border-top-color:var(--blue);}
.compare-card h3{margin:0 0 2px; font-size:15.5px; font-weight:800;}
.compare-card .cc-sub{font-size:12px; color:var(--grey-text); margin-bottom:14px;}
.cc-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px dashed var(--grey-line); font-size:13px;}
.cc-row:last-child{border-bottom:none;}
.cc-row .cc-num{font-weight:800; font-size:14.5px;}
.cc-badge{display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; margin-top:10px;}
.cc-badge.ok{background:var(--green-light); color:var(--green-dark);}
.cc-badge.late{background:var(--red-bg); color:var(--red);}
.cc-badge.closed{background:#E7E1F2; color:#5B4B94;}

/* ---------- FUNNEL / BAR CHARTS (svg) ---------- */
.chart-card{background:var(--white); border:1px solid var(--grey-line); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow);}
.chart-card h4{margin:0 0 14px; font-size:14px; font-weight:800;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px;}
.bar-row .bar-label{width:190px; flex-shrink:0; color:var(--dark); font-weight:600;}
.bar-track{flex:1; height:20px; background:var(--grey-bg); border-radius:6px; overflow:hidden; position:relative;}
.bar-fill{height:100%; border-radius:6px; display:flex; align-items:center; justify-content:flex-end; padding-right:8px;}
.bar-fill span{font-size:11px; font-weight:700; color:#fff;}
.legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:14px;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--grey-text);}
.legend-dot{width:9px; height:9px; border-radius:50%;}

/* ---------- INSIGHTS ---------- */
.insight-list{display:flex; flex-direction:column; gap:10px;}
.insight{
  background:var(--white); border:1px solid var(--grey-line); border-left:4px solid var(--green);
  border-radius:10px; padding:13px 16px; font-size:13px; line-height:1.55; box-shadow:var(--shadow);
}
.insight b{color:var(--dark);}
.insight.alert{border-left-color:var(--red);}
.insight.warn{border-left-color:var(--amber);}

/* ---------- GUIA INDIVIDUAL HEADER ---------- */
.guia-header{
  background:linear-gradient(135deg, var(--dark) 0%, #2b2718 100%);
  border-radius:var(--radius); padding:22px 26px; color:#fff; margin-bottom:22px;
  display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap;
}
.guia-header h2{margin:0; font-size:21px; font-weight:800; color:#fff;}
.guia-header .gh-sub{font-size:12.5px; color:#D8D5C8; margin-top:4px;}
.gh-meta{display:flex; gap:26px; flex-wrap:wrap;}
.gh-meta div{text-align:left;}
.gh-meta .gh-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:#B9B6A8;}
.gh-meta .gh-value{font-size:15px; font-weight:700; color:var(--cream); margin-top:3px;}
.gh-status{align-self:flex-start; font-size:11px; font-weight:700; padding:5px 12px; border-radius:20px;}
.gh-status.ok{background:rgba(83,162,70,.22); color:#8FD97F; border:1px solid rgba(143,217,127,.4);}
.gh-status.late{background:rgba(214,69,69,.2); color:#F1908F; border:1px solid rgba(241,144,143,.4);}
.gh-status.closed{background:rgba(123,107,180,.25); color:#C9BEEA; border:1px solid rgba(201,190,234,.4);}

/* ---------- FILTER BAR ---------- */
.filter-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.filter-bar input[type=text]{
  padding:9px 13px; border:1px solid var(--grey-line); border-radius:9px; font-size:13px; min-width:220px;
  background:var(--white);
}
.filter-bar select{
  padding:9px 12px; border:1px solid var(--grey-line); border-radius:9px; font-size:13px; background:var(--white); color:var(--dark);
}
.filter-count{font-size:12px; color:var(--grey-text); margin-left:auto;}

/* ---------- TABLE ---------- */
.table-wrap{background:var(--white); border:1px solid var(--grey-line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
thead th{
  background:var(--dark); color:#fff; text-align:left; padding:11px 12px; font-weight:700;
  font-size:11px; text-transform:uppercase; letter-spacing:.3px; position:sticky; top:0;
}
tbody td{padding:10px 12px; border-bottom:1px solid var(--grey-line); vertical-align:middle;}
tbody tr:hover{background:var(--grey-bg);}
.table-scroll{max-height:560px; overflow:auto;}
.status-chip{display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;}
.st-Contratado{background:var(--green-light); color:var(--green-dark);}
.st-Aprovado{background:#DDF3EE; color:#1E7A64;}
.st-BancoDeTalentos{background:#EAE5F5; color:#5B4B94;}
.st-SemStatus{background:#F3EFD9; color:#8A7A2B;}
.st-Admissão{background:#DDF3EE; color:#1E7A64;}
.st-Alinhamento{background:var(--grey-chip-bg); color:var(--grey-chip);}
.st-Triagem{background:var(--blue-bg); color:var(--blue);}
.st-EntrevistaAgendada{background:var(--blue-bg); color:var(--blue);}
.st-NãoCompareceu{background:var(--grey-chip-bg); color:var(--grey-chip);}
.st-Desistiu{background:var(--amber-bg); color:var(--amber);}
.st-Reprovado{background:var(--red-bg); color:var(--red);}
.prazo-chip{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px;}
.prazo-ok{background:var(--green-light); color:var(--green-dark);}
.prazo-late{background:var(--red-bg); color:var(--red);}
.prazo-na{background:var(--grey-chip-bg); color:var(--grey-chip);}
.heat-cell{font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:8px; display:inline-block;}
.heat-green{background:var(--green-light); color:var(--green-dark);}
.heat-amber{background:var(--amber-bg); color:var(--amber);}
.heat-red{background:var(--red-bg); color:var(--red);}
.heat-neutral{background:var(--grey-chip-bg); color:var(--grey-chip);}
.empty-state{padding:50px 20px; text-align:center; color:var(--grey-text);}
.empty-state .es-icon{font-size:34px; margin-bottom:10px;}
.empty-state h4{margin:0 0 6px; color:var(--dark); font-size:15px;}
.empty-state p{font-size:13px; margin:0; max-width:420px; margin:0 auto;}

/* ---------- FOOTER ---------- */
footer{text-align:center; padding:24px; font-size:11.5px; color:var(--grey-text);}
footer img{height:16px; vertical-align:middle; margin-right:6px; opacity:.7;}

@media(max-width:720px){
  .gh-meta{gap:16px;}
  .bar-row .bar-label{width:120px; font-size:11px;}
  .topbar{padding:14px 16px;}
  main{padding:18px 14px 40px;}
}
</style>
</head>

function fmtDate(s){
  if(!s) return '-';
  const parts = String(s).split('-');
  if(parts.length===3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
  return s;
}
function parseD(s){ return s ? new Date(s+'T00:00:00') : null; }
function byConsultoria(key){ return CANDIDATOS.filter(c=>c.consultoria===key); }

function garantiaStatus(c){
  if(!c.data_admissao) return {label:'Aguardando admissão', level:'neutral'};
  const admissao = parseD(c.data_admissao);
  if(admissao > HOJE) return {label:'Admissão prevista '+fmtDate(c.data_admissao), level:'neutral'};
  const limite = parseD(c.data_limite_garantia);
  if(c.data_saida){
    const saida = parseD(c.data_saida);
    return saida <= limite
      ? {label:'Saiu dentro da garantia, repor', level:'red'}
      : {label:'Saiu fora da garantia', level:'neutral'};
  }
  const totalDias = (limite - admissao)/86400000;
  const restam = Math.ceil((limite - HOJE)/86400000);
  if(restam < 0) return {label:'Garantia encerrada, colaborador ativo', level:'green'};
  const p = restam/totalDias;
  if(p<=0.15) return {label:`${restam}d restantes de garantia`, level:'red'};
  if(p<=0.4) return {label:`${restam}d restantes de garantia`, level:'amber'};
  return {label:`${restam}d restantes de garantia`, level:'green'};
}

function buildLineChart(dates, series, opts={}){
  const W = opts.w||600, H = opts.h||210, padL=34, padR=14, padT=14, padB=26;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const maxY = Math.max(1, ...series.flatMap(s=>s.data), opts.minMax||0);
  const stepX = dates.length>1 ? innerW/(dates.length-1) : 0;
  const x = i => padL + (dates.length>1 ? i*stepX : innerW/2);
  const y = v => padT + innerH - (v/maxY)*innerH;
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;" preserveAspectRatio="none">`;
  for(let g=0; g<=4; g++){
    const gy = padT + innerH - (g/4)*innerH;
    svg += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="#EAD9A0" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${gy+3}" font-size="9.5" fill="#7A6E4D" text-anchor="end">${Math.round(maxY*g/4)}</text>`;
  }
  dates.forEach((d,i)=>{
    svg += `<text x="${x(i)}" y="${H-8}" font-size="9.5" fill="#7A6E4D" text-anchor="middle">${fmtDate(d)}</text>`;
  });
  series.forEach(s=>{
    if(dates.length===1){
      svg += `<circle cx="${x(0)}" cy="${y(s.data[0]||0)}" r="4.5" fill="${s.color}"/>`;
    } else {
      const pts = s.data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
      svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
      s.data.forEach((v,i)=>{ svg += `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.color}"/>`; });
    }
  });
  svg += `</svg>`;
  return svg;
}

function timelineLegend(series){
  return `<div class="legend">${series.map(s=>`<div class="legend-item"><span class="legend-dot" style="background:${s.color};"></span>${s.name}</div>`).join('')}</div>`;
}

      <h3>${key}</h3>

      <div class="cc-row"><span>Desistências</span><span class="cc-num">${st['Desistiu']}</span></div>
      <div class="cc-row"><span>Reprovados</span><span class="cc-num">${st['Reprovado']}</span></div>
      <div class="cc-row"><span>Não compareceu</span><span class="cc-num">${st['Não compareceu']}</span></div>
      <div class="cc-row"><span>Taxa de conversão</span><span class="cc-num">${pct(st['Contratado'],list.length||1)}%</span></div>
      <span class="cc-badge ${encerrada?'closed':(fechamentoPassou?'late':'ok')}">${encerrada?p.status_contrato:(fechamentoPassou?'Prazo de entrega encerrado em '+fmtDate(p.data_fechamento_prazo):'Dentro do prazo de entrega · até '+fmtDate(p.data_fechamento_prazo))}</span>

  const etapaColors = {
    'Perdido na triagem':'#8B887E','Recusou o convite (não quis agendar)':'#B97A1E',
    'Recusou após agendar (não foi à entrevista)':'#C98A1D','Não compareceu / sem retorno':'#8B887E',

    });
    html += `</div>`;
  });
  html += `</div></div>`;

  // insights
  html += renderInsights();

  // garantia summary
  html += renderGarantiaSummary();

  document.getElementById('view-visao-geral').innerHTML = html;

function renderInsights(){
  const rj = byConsultoria('Soulan/RJ');
  const sp = byConsultoria('Soulan/SP');
  const lu = byConsultoria('Luandre/SP');
  const rjEtapa = etapaCounts(rj);
  const spEtapa = etapaCounts(sp);
  const rjForaPrazo = rj.filter(c=>c.dentro_prazo_envio==='Não').length;
  const rjContratados = rj.filter(c=>c.status==='Contratado').length;
  const spContratados = sp.filter(c=>c.status==='Contratado').length;
  const spAdmissao = sp.filter(c=>c.status==='Admissão').length;
  const rjSemStatus = rj.filter(c=>c.status==='Sem status / aguardando liderança').length;

  const items = [];
  items.push({cls:'alert', html:`<b>Contrato com a Luandre/SP encerrado em 11/08/2026, sem custo</b>, por não entrega. As 5 vagas de Campo Belo que estavam com ela foram transferidas para a Soulan/SP, que passa a responder por 42 vagas no total.`});
  items.push({cls:'', html:`<b>Soulan/RJ segue com ${rjContratados} contratados</b> de ${rj.length} candidatos enviados (${pct(rjContratados,rj.length)}% de conversão) para as 23 vagas de Botafogo.`});
  if(rjSemStatus>0){
    items.push({cls:'warn', html:`<b>${rjSemStatus} candidatos da Soulan/RJ estão sem status de admissão preenchido</b>, aguardando decisão da liderança. Vale cobrar retorno pra esses processos não ficarem parados.`});
  }
  const recusouAgendar = rjEtapa['Recusou o convite (não quis agendar)']||0;
  const recusouAposAgendar = rjEtapa['Recusou após agendar (não foi à entrevista)']||0;
  const semRetornoRj = rjEtapa['Não compareceu / sem retorno']||0;
  const totalRecusa = recusouAgendar+recusouAposAgendar+semRetornoRj;
  items.push({cls:'warn', html:`<b>Maior ponto de perda da Soulan/RJ segue sendo o candidato nem chegar à entrevista:</b> ${totalRecusa} candidatos (${pct(totalRecusa,rj.length)}%) não compareceram, mais que reprovação em entrevista (${rjEtapa['Reprovado na entrevista presencial']||0}).`});
  if(rjForaPrazo>0){
    items.push({cls:'warn', html:`<b>Soulan/RJ segue enviando candidatos fora do prazo formal:</b> ${rjForaPrazo} de ${rj.length} candidatos (prazo de entrega fechava em 17/07).`});
  }
  items.push({cls:'', html:`<b>Soulan/SP já tem sua primeira leva de candidatos:</b> ${sp.length} enviados para Guarulhos, Pinheiros, Oscar Freire e Moema, com ${spAdmissao} em fase de admissão${spContratados>0?` e ${spContratados} já contratados`:''}. Ainda sem candidatos para Leopoldo e para as novas vagas de Campo Belo.`});

  return `<div class="block"><h2 class="section-title">Principais insights</h2>
  <div class="insight-list">${items.map(i=>`<div class="insight ${i.cls}">${i.html}</div>`).join('')}</div></div>`;
}

function renderGarantiaSummary(){
  const comAdmissao = CANDIDATOS.filter(c=>c.data_admissao);
  const futuras = comAdmissao.filter(c=>parseD(c.data_admissao) > HOJE);
  const ativas = comAdmissao.filter(c=>parseD(c.data_admissao) <= HOJE);
  let html = `<div class="block"><h2 class="section-title">Reposição pós-admissão</h2>
  <p class="section-sub">Contagem inicia na data de admissão oficial de cada colaborador. Soulan/RJ e Luandre/SP: 30 dias corridos · Soulan/SP: 60 dias corridos</p>`;
  if(ativas.length===0){
    const proximaData = futuras.length ? futuras.map(c=>parseD(c.data_admissao)).sort((a,b)=>a-b)[0] : null;
    html += `<div class="chart-card"><div class="empty-state">
      <div class="es-icon">⏳</div>
      <h4>Nenhuma admissão confirmada ainda</h4>
      <p>${futuras.length} candidato(s) com admissão prevista${proximaData?', a partir de '+fmtDate(proximaData.toISOString().slice(0,10)):''}. Assim que a data chegar, esta seção passa a mostrar a contagem de garantia de cada colaborador em tempo real: os dias restantes diminuem sozinhos a cada dia que passa.</p>
    </div></div>`;
  } else {
    html += `<div class="table-wrap"><div class="table-scroll"><table><thead><tr>
      <th>Consultoria</th><th>Nome</th><th>Loja</th><th>Admissão</th><th>Limite garantia</th><th>Situação</th>
    </tr></thead><tbody>`;
    ativas.forEach(c=>{
      const g = garantiaStatus(c);
      html += `<tr><td>${c.consultoria}</td><td>${c.nome}</td><td>${c.loja}</td><td>${fmtDate(c.data_admissao)}</td><td>${fmtDate(c.data_limite_garantia)}</td>
      <td><span class="heat-cell heat-${g.level}">${g.label}</span></td></tr>`;
    });
    html += `</tbody></table></div></div>`;
  }
  html += `</div>`;
  return html;
}

function renderInsightsGuia(key, list, st, et, p, dentroPrazo, foraPrazo, fechamentoPassou){
  const items = [];
  const nomeConsult = key.split('/')[0];

  if(list.length===0){
    items.push({cls:'', html:`<b>Nenhum candidato recebido até o momento.</b> Alinhamento em ${fmtDate(p.data_alinhamento)}, com prazo de entrega até ${fmtDate(p.data_fechamento_prazo)}. ${fechamentoPassou?'O prazo formal já passou sem envio de candidatos, vale cobrar um posicionamento.':'Dentro do prazo esperado, sem motivo de alerta ainda.'}`});
    return `<div class="block"><h2 class="section-title">Análise individual</h2><div class="insight-list">${items.map(i=>`<div class="insight ${i.cls}">${i.html}</div>`).join('')}</div></div>`;
  }

  const conv = pct(st['Contratado'], list.length);
  if(st['Contratado']>0){
    items.push({cls:'', html:`<b>${st['Contratado']} candidato(s) contratado(s)</b> de ${list.length} enviados, taxa de conversão de ${conv}% sobre o total encaminhado pela ${nomeConsult}.`});
  } else {
    items.push({cls:'alert', html:`<b>Nenhuma contratação confirmada até agora</b>, apesar de ${list.length} candidato(s) já encaminhado(s). Vale entender com a ${nomeConsult} o motivo da conversão zerada.`});
  }

  const etapaEntries = Object.entries(et).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(etapaEntries.length){
    const [top, topN] = etapaEntries[0];
    items.push({cls:'warn', html:`<b>Maior ponto de perda: "${top}"</b>, com ${topN} candidato(s) (${pct(topN,list.length)}% do total encaminhado). É onde vale concentrar o ajuste de processo com a consultoria.`});
  }

  if(foraPrazo>0){
    items.push({cls:'warn', html:`<b>${foraPrazo} candidato(s)</b> (${pct(foraPrazo,list.length)}%) foram enviados fora do prazo formal combinado, que fechava em ${fmtDate(p.data_fechamento_prazo)}.`});
  } else {
    items.push({cls:'', html:`<b>Todos os candidatos foram enviados dentro do prazo</b> combinado com a ${nomeConsult}.`});
  }

  const emAndamento = (st['Alinhamento']||0)+(st['Triagem']||0)+(st['Entrevista agendada']||0)+(st['Aprovado']||0)+(st['Admissão']||0)+(st['Sem status / aguardando liderança']||0);
  if(emAndamento>0){
    items.push({cls:'', html:`<b>${emAndamento} candidato(s) ainda em andamento</b> no funil, sem desfecho registrado até o momento${st['Sem status / aguardando liderança']?` (${st['Sem status / aguardando liderança']} deles aguardando decisão da liderança)`:''}.`});
  }

  const comAdmissao = list.filter(c=>c.data_admissao);
  const ativas = comAdmissao.filter(c=>parseD(c.data_admissao) <= HOJE);
  const emRisco = ativas.filter(c=>{ const g = garantiaStatus(c); return g.level==='red' || g.level==='amber'; });
  if(emRisco.length>0){
    items.push({cls:'alert', html:`<b>${emRisco.length} colaborador(es) próximo(s) do fim do prazo de garantia</b> de reposição (${p.dias_garantia} dias). Vale acompanhar de perto para garantir a reposição a tempo, se necessário.`});
  }

  return `<div class="block"><h2 class="section-title">Análise individual</h2><div class="insight-list">${items.map(i=>`<div class="insight ${i.cls}">${i.html}</div>`).join('')}</div></div>`;
}

function renderGuia(key){

    ${kpiCard('Fora do prazo de envio', foraPrazo, {cls: foraPrazo>0 ? 'danger':''})}
    ${kpiCard('Em admissão', st['Admissão'])}
    ${kpiCard('Contratados', st['Contratado'], {cls:'accent'})}
    ${kpiCard('Desistências', st['Desistiu'], {cls:'warn'})}
    ${kpiCard('Reprovados', st['Reprovado'], {cls:'danger'})}
    ${kpiCard('Não compareceu', st['Não compareceu'])}
  </div></div>`;

  if(list.length>0){

    });
    html += `</div></div>`;

    const etapaEntries = Object.entries(et).filter(([k,v])=>v>0);

      html += `<div class="block"><div class="chart-card"><h4>Onde os candidatos foram perdidos</h4>`;

        const w = Math.max(pct(v,maxEt),4);

    </tr></thead><tbody>
    ${list.map(rowHtml).join('')}
    </tbody></table></div></div>`;
  }
  html += `</div>`;

  document.getElementById('view-'+key).innerHTML = html;
  if(list.length>0) filterTable(key);
}

function cssId(key){ return key.replace('/','-'); }

function rowHtml(c){
  const g = garantiaStatus(c);
  const prazoCls = c.dentro_prazo_envio==='Sim' ? 'prazo-ok' : (c.dentro_prazo_envio==='Não' ? 'prazo-late' : 'prazo-na');
  const prazoLabel = c.dentro_prazo_envio==='Sim' ? 'Dentro do prazo' : (c.dentro_prazo_envio==='Não' ? 'Fora do prazo' : '-');
  return `<tr data-nome="${(c.nome||'').toLowerCase()}" data-status="${c.status||''}" data-cargo="${c.cargo||''}">
    <td>${c.nome||'-'}</td>
    <td>${c.loja||'-'}</td>
    <td>${c.cargo||'-'}</td>
    <td>${fmtDate(c.data_envio)}</td>
    <td><span class="prazo-chip ${prazoCls}">${prazoLabel}</span></td>
    <td><span class="status-chip ${STATUS_CLASS[c.status]||''}">${c.status||'-'}</span></td>
    <td style="color:var(--grey-text); font-size:11.5px;">${c.etapa_perda&&c.etapa_perda!=='Não se aplica'?c.etapa_perda:'-'}</td>
    <td>${fmtDate(c.data_admissao)}</td>
    <td>${c.data_admissao?`<span class="heat-cell heat-${g.level}">${g.label}</span>`:'<span style="color:var(--grey-text);">-</span>'}</td>
  </tr>`;
}

function filterTable(key){
  const id = cssId(key);
  const search = document.getElementById('search-'+id).value.toLowerCase();
  const status = document.getElementById('filter-status-'+id).value;
  const cargo = document.getElementById('filter-cargo-'+id).value;
  const rows = document.querySelectorAll(`#table-${id} tbody tr`);
  let visible = 0;
  rows.forEach(r=>{
    const matchesSearch = r.dataset.nome.includes(search);
    const matchesStatus = !status || r.dataset.status===status;
    const matchesCargo = !cargo || r.dataset.cargo===cargo;
    const show = matchesSearch && matchesStatus && matchesCargo;
    r.style.display = show ? '' : 'none';
    if(show) visible++;
  });
  const countEl = document.getElementById('count-'+id);
  if(countEl) countEl.textContent = `${visible} de ${rows.length} candidatos`;
}

/* ============ TABS ============ */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
  });
});

renderGuia('Soulan/SP');
renderGuia('Luandre/SP');
